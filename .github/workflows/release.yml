name: Release

# Pushing a tag like v0.1.0 builds a signed APK and publishes it as a GitHub release, which
# is what Obtainium watches. The APK always has the same name, so
#   https://github.com/michael412133/zmanim-luach/releases/latest/download/zmanim-luach.apk
# is a download link that keeps working from one release to the next.

on:
  push:
    tags:
      - 'v*'
  # To build a tag again by hand, if a run failed half way.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, like v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The key and its passwords are one secret: a packed copy of the signing/ folder.
      - name: Restore the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is not set, so the release cannot be signed."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d | tar -xz
          test -f signing/signing.keystore
          test -f signing/signing.properties

      - name: Test
        run: ./gradlew --no-daemon :app:testReleaseUnitTest -PappVersion="$TAG"

      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleRelease -PappVersion="$TAG"

      # A phone only takes an update signed with the same key as the version it has, so this
      # checks for that exact key before anything is published.
      - name: Check the APK is signed with the app's key
        env:
          EXPECTED: f050311f99c7d03079fd9699be98d3c63538192f7176de1a5ef20641890be7e7
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::The APK is signed with '$digest', not the app's key $EXPECTED."
            exit 1
          fi
          cp "$apk" zmanim-luach.apk
          sha256sum zmanim-luach.apk > zmanim-luach.apk.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            zmanim-luach.apk
            zmanim-luach.apk.sha256
